name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
      UV_LOCKED: "true"
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: cache
      DB_NAME: cache
      # Disposable CI credentials; never use these outside this service.
      DB_PASS: ci-only-not-a-secret
    services:
      postgres:
        image: postgres:17
        env:
          # Official image requires these keys; keep values aligned with DB_* above.
          POSTGRES_USER: cache
          POSTGRES_DB: cache
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.9.5"
          python-version: "3.12"
          enable-cache: false
      - name: Install dependencies from lockfile
        run: uv sync --locked
      - name: Ruff
        run: make lint
      - name: Unit tests
        run: make test
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Integration tests
        run: |
          uv run python - <<'PYTHON'
          import os
          import subprocess
          from cache_service.config import Settings
          os.environ["TEST_DATABASE_URL"] = Settings().database_url.get_secret_value()
          raise SystemExit(subprocess.call(["make", "test-integration"]))
          PYTHON
      - name: Build Docker image
        run: docker build --tag cache-service:ci .
