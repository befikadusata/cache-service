services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: cache
      POSTGRES_USER: cache
      POSTGRES_PASSWORD: ${CACHE_DATABASE_PASSWORD:?Set CACHE_DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:${CACHE_DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cache -d cache"]
      interval: 2s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    environment: &service-environment
      CACHE_DATABASE_URL: postgresql+asyncpg://cache:${CACHE_DATABASE_PASSWORD:?Set CACHE_DATABASE_PASSWORD in .env}@database:5432/cache
    command: ["alembic", "upgrade", "head"]
    depends_on:
      database:
        condition: service_healthy
  api:
    build: .
    environment: *service-environment
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres-data:
