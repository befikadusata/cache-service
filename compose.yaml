services:
  database:
    image: postgres:17
    environment:
      # These keys belong to the official image; project settings use DB_*.
      POSTGRES_DB: ${DB_NAME:-cache}
      POSTGRES_USER: ${DB_USER:-cache}
      POSTGRES_PASSWORD: ${DB_PASS:?Set DB_PASS in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    environment: &service-environment
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: ${DB_USER:-cache}
      DB_NAME: ${DB_NAME:-cache}
      DB_PASS: ${DB_PASS:?Set DB_PASS in .env}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      database:
        condition: service_healthy
  api:
    build: .
    environment: *service-environment
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres-data:
